name: Deploy

# main 에서 CI(테스트 + 도커 확인)가 성공하면 EC2 로 배포. 수동 실행도 가능.
#   1) 이미지 빌드 -> ECR 푸시 (태그: 커밋 SHA, latest)
#   2) SSH 로 EC2 에 compose.yaml/.env 를 쓰고 새 이미지로 app 교체
#      (EC2 에 IAM 역할이 없어서, ECR 로그인 토큰(12시간 유효)을 여기서 받아 SSH 로 넘겨 줌)
#   3) 공개 주소로 스모크 테스트
# 필요한 설정 (infra/README.md)
#   Variables: AWS_REGION, ECR_REPOSITORY, EC2_HOST, SERVICE_URL, (선택) EC2_USER
#   Secrets  : AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, EC2_SSH_KEY
# EC2_HOST 를 등록하기 전에는 배포 작업을 건너뛴다.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.EC2_HOST != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 + ECR 푸시
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$REPO:$SHA" -t "$REPO:latest" .
          docker push "$REPO:$SHA"
          docker push "$REPO:latest"
          echo "IMAGE=$REPO:$SHA" >> "$GITHUB_ENV"

      - name: EC2 에 배포 (SSH)
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          TARGET: ${{ vars.EC2_USER || 'ec2-user' }}@${{ vars.EC2_HOST }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          install -m 600 /dev/null deploy_key && printf '%s\n' "$SSH_KEY" > deploy_key
          OPTS="-i deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          scp $OPTS compose.yaml "$TARGET:/opt/mlopspr/compose.yaml"
          aws ecr get-login-password | ssh $OPTS "$TARGET" "sudo docker login --username AWS --password-stdin $REGISTRY"
          ssh $OPTS "$TARGET" "set -e; cd /opt/mlopspr
            printf 'IMAGE=%s\nPORT=80\n' '$IMAGE' > .env
            sudo docker compose pull app
            sudo docker compose up -d --wait app
            sudo docker image prune -af --filter until=168h
            sudo docker compose ps"
          rm -f deploy_key

      - name: 스모크 테스트 (공개 주소)
        run: |
          for i in 1 2 3 4 5 6; do
            python3 smoke_test.py "${{ vars.SERVICE_URL }}" && exit 0
            echo "재시도 대기 ($i)"; sleep 10
          done
          exit 1
